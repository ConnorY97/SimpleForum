<!DOCTYPE html>
<html>
<head>
    <title>Forum List</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 2em auto;
            padding: 2em;
            background-color: #f9f9f9;
            color: #333;
        }

        h1 {
            font-size: 2em;
            margin-bottom: 1em;
        }

        ul {
            list-style: none;
            padding: 0;
        }

        li {
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 1em;
            margin-bottom: 1em;
        }

            li a {
                font-size: 2em;
                color: #007BFF;
                text-decoration: none;
            }

                li a:hover {
                    text-decoration: underline;
                }

        small {
            color: #888;
        }

        a {
            display: inline-block;
            color: #007BFF;
            text-decoration: none;
        }

            a:hover {
                text-decoration: underline;
            }
    </style>
</head>
<body>
    <h1>All Forums</h1>

    <ul>
        {{#forums}}
        <li>
            <strong><a href="/forum/{{id}}">{{title}}</a></strong><br>
            {{description}}<br>
            <small>By {{createdBy}} on {{createdAt}}</small>
        </li>
        {{/forums}}
    </ul>

    <a href="/">← Back to Home</a>
</body>
</html>
