<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SimpleForum</title>
    <link rel="stylesheet" href="/public/styles/homeStyle.css">
</head>
<body>
    <h1>Welcome to SimpleForum</h1>
    <p>A lightweight forum demo built with C++ and Crow.</p>

    {{#response}}
    <p class="response">{{response}}</p>
    {{/response}}

<div class="nav">
    {{#isLoggedIn}}
        <a href="/forums">Show Forums</a>
        <a href="/create-forum">Create Forum</a>
        <a href="#" onclick="logout(event)">Log Out</a>
        {{#admin}}
            <a href="/admin/users">Show Users</a>
        {{/admin}}
    {{/isLoggedIn}}
    {{^isLoggedIn}}
        <a href="/login">Login</a>
        <a href="/register">Register</a>
    {{/isLoggedIn}}
</div>

    <footer>
        <p>&copy; 2025 SimpleForum Project</p>
    </footer>

    <script>
        function logout(event) {
            event.preventDefault();

            fetch('/logout', {
                method: 'POST',
                credentials: 'same-origin'
            }).then(response => {
                if (response.ok) {
                    window.location.href = '/';
                } else {
                    alert("Logout failed.");
                }
            }).catch(err => {
                console.error("Error logging out:", err);
            });
        }
    </script>
</body>
</html>
