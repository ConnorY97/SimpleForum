<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SimpleForum</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: auto;
            padding: 2rem;
            background-color: #f9f9f9;
            color: #333;
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 0.5em;
        }

        p {
            font-size: 1.1em;
            margin-bottom: 1.5em;
        }

        .nav {
            margin-top: 1.5rem;
        }

            .nav a {
                display: inline-block;
                margin-right: 1.2rem;
                padding: 0.4rem 0;
                font-size: 1.1em;
                text-decoration: none;
                color: #007BFF;
            }

                .nav a:hover {
                    text-decoration: underline;
                }

        footer {
            margin-top: 4rem;
            color: #aaa;
            font-size: 0.9rem;
            text-align: center;
        }

        .response {
            color: green;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>Welcome to SimpleForum</h1>
    <p>A lightweight forum demo built with C++ and Crow.</p>

    {{#response}}
    <p class="response">{{response}}</p>
    {{/response}}

    <div class="nav">
        <a href="/forums">Show Forums</a>
        {{#isLoggedIn}}
        <a href="/create-forum">Create Forum</a>
        <a href="#" onclick="logout(event)">Log Out</a>
        {{/isLoggedIn}}
        {{^isLoggedIn}}
        <a href="/login">Login</a>
        <a href="/register">Register</a>
        {{/isLoggedIn}}
    </div>

    <footer>
        <p>&copy; 2025 SimpleForum Project</p>
    </footer>

    <script>
        function logout(event) {
            event.preventDefault();

            fetch('/logout', {
                method: 'POST',
                credentials: 'same-origin'
            }).then(response => {
                if (response.ok) {
                    window.location.href = '/';
                } else {
                    alert("Logout failed.");
                }
            }).catch(err => {
                console.error("Error logging out:", err);
            });
        }
    </script>
</body>
</html>
