<!DOCTYPE html>
<html>
<head>
    <title>{{title}}</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 2em auto;
            max-width: 800px;
            line-height: 1.6;
            background-color: #f9f9f9;
            padding: 2em;
            color: #333;
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 0.2em;
        }

        h2 {
            font-size: 2em;
            font-weight: normal;
            color: #555;
            margin-top: 0;
        }

        .post-meta {
            font-size: 0.9em;
            color: #888;
            margin-bottom: 2em;
        }

        .comment {
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 1em;
            margin-bottom: 1em;
        }

            .comment strong {
                color: #2a5885;
            }

            .comment small {
                display: block;
                color: #999;
                margin-top: 0.5em;
            }

        form {
            margin-top: 2em;
        }

        input[type="text"] {
            width: 100%;
            padding: 0.8em;
            font-size: 1em;
            border: 1px solid #ccc;
            border-radius: 6px;
            margin-bottom: 1em;
        }

        input[type="submit"] {
            padding: 0.7em 1.5em;
            font-size: 1em;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

            input[type="submit"]:hover {
                background-color: #0056b3;
            }

            input[type="submit"].save {
                padding: 0.4em 1em;
                font-size: 0.9em;
                background-color: #007BFF;
                color: white;
                border: none;
                border-radius: 4px;
                cursor: pointer;
            }
                input[type="submit"].save:hover {
                    background-color: #0056b3;
                }

            input[type="submit"].edit-button {
                padding: 0.4em 1em;
                font-size: 0.9em;
                background-color: #ccc;
                color: #333;
                border: none;
                border-radius: 4px;
                cursor: pointer;
            }

                input[type="submit"].edit-button:hover {
                    background-color: #bbb;
                }

        button.cancel {
            padding: 0.4em 1em;
            font-size: 0.9em;
            background-color: #ccc;
            color: #333;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

            button.cancel:hover {
                background-color: #bbb;
            }

        .error {
            color: red;
            margin-top: 1em;
        }

        a {
            display: inline-block;
            margin-top: 2em;
            color: #007BFF;
            text-decoration: none;
        }

            a:hover {
                text-decoration: underline;
            }
    </style>
</head>
<body>
    <h1>{{title}}</h1>
    <h2>{{description}}</h2>
    <p class="post-meta">Posted by {{createdBy}} on {{createdAt}}</p>

    {{#canEditPost}}
        <p>This is your post</p>
    {{/canEditPost}}

    <h3>Comments</h3>
    {{#comments}}
    <div class="comment" id="comment-{{id}}" data-created-at="{{createdAt}}">
        <p><strong>{{username}}</strong>: {{comment}}</p>
        <small>{{createdAt}}</small>

        <div style="display: flex; gap: 0.5em; margin-top: 0.5em;">
            {{#canEditComment}}
                <form onsubmit="return startEdit({{ id }}, '{{comment}}')">
                    <input type="submit" value="Edit" class="edit-button">
                </form>
                <form onsubmit="return deleteComment(event, {{id}})">
                    <input type="submit" value="Delete" class="edit-button">
                </form>
            {{/canEditComment}}
        </div>
    </div>
    {{/comments}}

    {{#error}}
    <p class="error">{{error}}</p>
    {{/error}}

    <form onsubmit="return addComment(event, {{id}})">
        <input type="text" id="new-comment-input" name="comment" placeholder="Write a comment..." required>
        <input type="submit" value="Post">
    </form>


    <a href="/forums">← Back to forum list</a>

    <script>
        function getUsernameFromCookie() {
            const cookies = document.cookie.split('; ');
            for (const cookie of cookies) {
                const [name, value] = cookie.split('=');
                if (name === 'user') {
                    return decodeURIComponent(value);
                }
            }
            return 'You';
        }

        function submitEdit(event, commentId) {
            event.preventDefault();

            const input = document.getElementById(`edit-input-${commentId}`);
            const updatedComment = input.value;

            const commentDiv = document.getElementById(`comment-${commentId}`);
            const createdAt = commentDiv.dataset.createdAt;

            fetch(`/comment/${commentId}/edit`,
                {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: `updatedComment=${encodeURIComponent(updatedComment)}`
                })
                .then(res => {
                    if (res.ok) {
                        commentDiv.innerHTML =
                            `
                                <p><strong>${getUsernameFromCookie()}</strong>: ${updatedComment}</p>
                                <small>${createdAt}</small>
                                <form onsubmit="return startEdit(${commentId}, '${updatedComment.replace(/'/g, "\\'")}')">
                                    <input type="submit" value="Edit" class="edit-button">
                                </form>
                            `;
                    }
                    else {
                        alert("Failed to update comment.");
                    }
                });

            return false;
        }


        function cancelEdit(event, commentId, originalComment) {
            event.preventDefault();

            const commentDiv = document.getElementById(`comment-${commentId}`);
            const username = getUsernameFromCookie();

            commentDiv.innerHTML =
                `
                        <p><strong>${username}</strong>: ${originalComment}</p>
                        <small>just now</small>
                        <div style="display: flex; gap: 0.5em; margin-top: 0.5em;">
                            <form onsubmit="return startEdit(${commentId}, '${originalComment.replace(/'/g, "\\'")}')">
                                <input type="submit" value="Edit" class="edit-button">
                            </form>
                            <form onsubmit="return deleteComment(event, ${commentId})">
                                <input type="submit" value="Delete" class="edit-button">
                            </form>
                        </div>
                    `;
            return false;
        }

        function startEdit(commentId, originalComment) {
            const commentDiv = document.getElementById(`comment-${commentId}`);
            commentDiv.innerHTML =
                `
                        <form onsubmit="return submitEdit(event, ${commentId})">
                            <input type="text" id="edit-input-${commentId}" value="${originalComment}" required>
                            <input type="submit" value="Save" class="save">
                            <button type="button" onclick="cancelEdit(event, ${commentId}, '${originalComment.replace(/'/g, "\\'")}')" class="cancel">Cancel</button>
                        </form>
                    `;
            return false;
        }

        function addComment(event, forumId) {
            event.preventDefault();
            const input = document.getElementById("new-comment-input");
            const comment = input.value;

            fetch(`/forum/${forumId}`,
                {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: `comment=${encodeURIComponent(comment)}`
                })
                .then(res => {
                    if (res.ok) {
                        location.reload();
                    }
                    else {
                        alert("Failed to post comment.");
                    }
                });

            return false;
        }

        function deleteComment(event, commentId) {
            event.preventDefault();

            fetch(`/delete/${commentId}`,
                {
                    method: 'POST'
                })
                .then(res => {
                    if (res.ok) {
                        location.reload();
                    }
                    else {
                        alert("Failed to delete comment.");
                    }
                });

            return false;
        }

    </script>
</body>
</html>
