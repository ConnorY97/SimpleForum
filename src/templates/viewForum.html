<!DOCTYPE html>
<html>
<head>
    <title>{{title}}</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 2em auto;
            max-width: 800px;
            line-height: 1.6;
            background-color: #f9f9f9;
            padding: 2em;
            color: #333;
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 0.2em;
        }

        h2 {
            font-size: 2em;
            font-weight: normal;
            color: #555;
            margin-top: 0;
        }

        .post-meta {
            font-size: 0.9em;
            color: #888;
            margin-bottom: 2em;
        }

        .comment {
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 1em;
            margin-bottom: 1em;
        }

            .comment strong {
                color: #2a5885;
            }

            .comment small {
                display: block;
                color: #999;
                margin-top: 0.5em;
            }

        form {
            margin-top: 2em;
        }

        input[type="text"] {
            width: 100%;
            padding: 0.8em;
            font-size: 1em;
            border: 1px solid #ccc;
            border-radius: 6px;
            margin-bottom: 1em;
        }

        input[type="submit"] {
            padding: 0.7em 1.5em;
            font-size: 1em;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

            input[type="submit"]:hover {
                background-color: #0056b3;
            }

        .error {
            color: red;
            margin-top: 1em;
        }

        a {
            display: inline-block;
            margin-top: 2em;
            color: #007BFF;
            text-decoration: none;
        }

            a:hover {
                text-decoration: underline;
            }
    </style>
</head>
<body>
    <h1>{{title}}</h1>
    <h2>{{description}}</h2>
    <p class="post-meta">Posted by {{createdBy}} on {{createdAt}}</p>

    <h3>Comments</h3>
    {{#comments}}
    <div class="comment">
        <p><strong>{{username}}</strong>: {{comment}}</p>
        <small>{{createdAt}}</small>
    </div>
    {{/comments}}
    {{^comments}}
    <p>No comments yet.</p>
    {{/comments}}

    {{#error}}
    <p class="error">{{error}}</p>
    {{/error}}
    <form action="/forum/{{id}}" method="POST">
        <input type="text" name="comment" placeholder="Write a comment..." required>
        <input type="submit" value="Post">
    </form>

    <a href="/forums">← Back to forum list</a>
</body>
</html>
