<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create Forum</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 2em auto;
            max-width: 800px;
            line-height: 1.6;
            background-color: #f9f9f9;
            padding: 2em;
            color: #333;
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 0.5em;
        }

        form {
            margin-top: 2em;
        }

        label {
            display: block;
            margin-bottom: 0.5em;
            font-weight: bold;
        }

        input[type="text"] {
            width: 100%;
            padding: 0.8em;
            font-size: 1em;
            border: 1px solid #ccc;
            border-radius: 6px;
            margin-bottom: 1.5em;
        }

        input[type="submit"] {
            padding: 0.7em 1.5em;
            font-size: 1em;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        input[type="submit"]:hover {
            background-color: #0056b3;
        }

        .error {
            color: red;
            margin-top: 1em;
        }

        a {
            display: inline-block;
            margin-top: 2em;
            color: #007BFF;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <h1>Create Forum</h1>

    {{#error}}
    <p class="error">{{error}}</p>
    {{/error}}

    <form action="/create-forum" method="POST">
        <label for="title">Title:</label>
        <input type="text" id="title" name="title" required>

        <label for="description">Description:</label>
        <input type="text" id="description" name="description" required>

        <input type="submit" value="Post">
    </form>

    <a href="/">← Back to Home</a>
</body>
</html>
