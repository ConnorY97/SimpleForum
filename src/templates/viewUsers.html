<!DOCTYPE html>
<html>
<head>
    <title>Admin - User List</title>
    <link rel="stylesheet" href="/public/styles/baseStyle.css">
    <link rel="stylesheet" href="/public/styles/adminStyle.css">
</head>
<body>
    <h1>All Users</h1>
    <h2>Admin view</h2>

    <table class="user-table">
        <thead>
            <tr>
                <th>Username</th>
                <th>Password</th>
            </tr>
        </thead>
        <tbody>
            {{#users}}
            <tr>
                <td>{{username}}</td>
                <td>{{password}}</td>
            </tr>
            {{/users}}
            {{^users}}
            <tr>
                <td colspan="2">No users found.</td>
            </tr>
            {{/users}}
        </tbody>
    </table>

    <a href="/">Back to Home</a>
</body>
</html>
