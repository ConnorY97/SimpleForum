<!DOCTYPE html>
<html>
<head>
    <title>Admin - User List</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <h1>User List</h1>

    <table style="width:100%; border-collapse: collapse;">
        <thead>
            <tr style="background-color: #eee;">
                <th style="padding: 0.8em; border: 1px solid #ccc;">Username</th>
                <th style="padding: 0.8em; border: 1px solid #ccc;">Password</th>
            </tr>
        </thead>
        <tbody>
            {{#users}}
            <tr>
                <td style="padding: 0.8em; border: 1px solid #ccc;">{{username}}</td>
                <td style="padding: 0.8em; border: 1px solid #ccc;">{{password}}</td>
            </tr>
            {{/users}}
            {{^users}}
            <tr>
                <td colspan="2" style="padding: 0.8em; text-align: center;">No users found.</td>
            </tr>
            {{/users}}
        </tbody>
    </table>

    <a href="/">Back to Home</a>
</body>
</html>
