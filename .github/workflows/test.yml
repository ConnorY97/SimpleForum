name: Test

on:
  workflow_dispatch:
    {}

jobs:
  Test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Create Build Directory
        shell: bash
        run: mkdir build

      - name: Enable Testing
        shell: bash
        run: cmake -S . -B build -DBUILD_TESTS=ON

      - name: Compile
        working-directory: build
        run: cmake --build .

      - name: Run test_login
        working-directory: build
        run: ./tests/test_login --reporter junit --out test_login.xml || true

      - name: Run test_forums
        working-directory: build
        run: ./tests/test_forums --reporter junit --out test_forums.xml || true

      - name: Run test_comments
        working-directory: build
        run: ./tests/test_comments --reporter junit --out test_comments.xml || true

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Test Results
          path: build/*.xml

      - name: Upload Results
        uses: dorny/test-reporter@v2
        with:
            fail-on-empty: "false"
            name: Test Results
            path: "build/*.xml"
            reporter: java-junit
